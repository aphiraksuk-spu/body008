<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Table styles for the admin page only (style.css has no table rules) */
    .table-wrap {
      overflow-x: auto;
      border: var(--line-width) solid var(--color-line);
    }

    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--line-width) solid var(--color-line);
    }

    #ordersTable thead th {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      white-space: nowrap;
      color: var(--color-accent-deep);
      background: var(--color-cream);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background: var(--color-cream);
    }

    #ordersTable td:first-child {
      white-space: nowrap;
      color: var(--color-ink-mute);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Admin</span>
          <h1>รายการสั่งซื้อ</h1>
          <hr class="rule">
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="index.html" class="logo">Body Scent</a>
      <p class="site-footer__copy">&copy; Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
